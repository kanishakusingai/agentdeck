appId: com.kanishak.agentdeck
productName: AgentDeck
directories:
  buildResources: build
  output: release
files:
  - 'out/**/*'
  - 'resources/**/*'
  - 'package.json'
asarUnpack:
  - resources/**
  - node_modules/@lydell/**
win:
  executableName: AgentDeck
  target:
    - nsis
nsis:
  artifactName: AgentDeck-${version}-setup.${ext}
  shortcutName: AgentDeck
  uninstallDisplayName: AgentDeck
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: false
